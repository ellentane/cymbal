name: token-probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo test > probe.txt
          gh release upload v1.2.1 probe.txt --clobber 2>&1 || true
